<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledgerly — Finance & Document Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink:'#17202a', muted:'#6d7885', cream:'#f7f8f6', line:'#e7eae7', lime:'#d7f36a', mint:'#e8f7ed', navy:'#153b4a' }, boxShadow: { soft:'0 18px 50px rgba(20,39,45,.08)' } }, fontFamily: { sans:['Inter','ui-sans-serif','system-ui'] } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{font-family:'DM Sans',sans-serif} h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif}.nav-item.active{background:#17202a;color:#fff}.nav-item.active svg{color:#d7f36a}.chart-grid{background-image:linear-gradient(#e7eae7 1px,transparent 1px),linear-gradient(90deg,#e7eae7 1px,transparent 1px);background-size:100% 50px,80px 100%}.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} .toast{animation:toast 3s both}@keyframes toast{0%,100%{opacity:0;transform:translateY(15px)}10%,85%{opacity:1;transform:none}}
  </style>
</head>
<body class="bg-cream text-ink">
  <div class="flex min-h-screen">
    <aside class="hidden w-64 shrink-0 border-r border-line bg-white p-5 lg:flex lg:flex-col">
      <div class="brand flex items-center gap-2 text-xl font-bold"><span class="grid h-9 w-9 place-items-center rounded-xl bg-ink text-lime">L</span> ledgerly<span class="text-lime">.</span></div>
      <div class="mt-12 text-[10px] font-bold uppercase tracking-[.2em] text-muted">Workspace</div>
      <nav class="mt-3 space-y-1" id="nav"></nav>
      <div class="mt-auto rounded-2xl bg-navy p-4 text-white"><div class="mb-3 flex items-center justify-between"><span class="text-xs text-white/60">Plan usage</span><i data-lucide="sparkles" class="h-4 w-4 text-lime"></i></div><div class="mb-2 text-sm font-semibold">Pro workspace</div><div class="h-1.5 rounded-full bg-white/20"><div class="h-1.5 w-3/5 rounded-full bg-lime"></div></div><div class="mt-2 text-[11px] text-white/60">60% of 10 GB used</div></div>
      <div class="mt-5 flex items-center gap-3 border-t border-line pt-5"><div class="grid h-9 w-9 place-items-center rounded-full bg-lime font-bold">SK</div><div class="min-w-0"><div class="truncate text-sm font-semibold">Sumit Sharma</div><div class="truncate text-xs text-muted">Owner account</div></div><i data-lucide="more-horizontal" class="ml-auto h-4 w-4 text-muted"></i></div>
    </aside>
    <main class="min-w-0 flex-1">
      <header class="flex h-20 items-center justify-between border-b border-line bg-white px-5 sm:px-8"><div><div class="text-xs text-muted">Monday, September 21, 2026</div><h1 id="pageTitle" class="mt-1 text-xl font-bold">Good morning, Sumit <span>👋</span></h1></div><div class="flex items-center gap-3"><button class="hidden rounded-xl border border-line p-2.5 text-muted sm:block"><i data-lucide="search" class="h-4 w-4"></i></button><button onclick="toast('You are all caught up!')" class="relative rounded-xl border border-line p-2.5 text-muted"><i data-lucide="bell" class="h-4 w-4"></i><span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-red-400"></span></button><button onclick="openModal()" class="flex items-center gap-2 rounded-xl bg-ink px-4 py-2.5 text-sm font-semibold text-white"><i data-lucide="plus" class="h-4 w-4 text-lime"></i><span class="hidden sm:inline">Add new</span></button></div></header>
      <div class="flex items-center gap-2 overflow-x-auto border-b border-line bg-white px-5 py-3 lg:hidden"><button class="rounded-lg bg-ink px-3 py-2 text-xs font-semibold text-white">Overview</button><button class="rounded-lg px-3 py-2 text-xs text-muted">Transactions</button><button class="rounded-lg px-3 py-2 text-xs text-muted">Documents</button></div>
      <section id="content" class="fade p-5 sm:p-8"></section>
    </main>
  </div>
  <div id="modal" class="fixed inset-0 z-20 hidden items-center justify-center bg-ink/40 p-4"><div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-soft"><div class="flex items-center justify-between"><h2 class="text-xl font-bold">Add new item</h2><button onclick="closeModal()" class="rounded-lg p-2 hover:bg-cream"><i data-lucide="x" class="h-4 w-4"></i></button></div><p class="mt-1 text-sm text-muted">Choose what you want to add to your workspace.</p><div class="mt-6 grid grid-cols-2 gap-3"><button onclick="toast('Invoice flow ready to connect');closeModal()" class="rounded-2xl border border-line p-4 text-left hover:border-ink"><i data-lucide="receipt" class="mb-5 h-5 w-5 text-navy"></i><div class="font-semibold">Invoice</div><div class="mt-1 text-xs text-muted">Track money in & out</div></button><button onclick="toast('Document upload ready');closeModal()" class="rounded-2xl border border-line p-4 text-left hover:border-ink"><i data-lucide="file-up" class="mb-5 h-5 w-5 text-navy"></i><div class="font-semibold">Document</div><div class="mt-1 text-xs text-muted">Upload & organise files</div></button></div></div></div><div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-30 hidden -translate-x-1/2 rounded-full bg-ink px-5 py-3 text-sm font-medium text-white shadow-soft"></div>
<script>
const navItems=[['layout-dashboard','Overview'],['arrow-left-right','Transactions'],['file-text','Documents'],['receipt','Invoices'],['users','Contacts'],['settings','Settings']];
const nav=document.querySelector('#nav');nav.innerHTML=navItems.map((x,i)=>`<button onclick="navigate('${x[1]}')" class="nav-item ${i?'':'active'} flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-muted transition hover:bg-cream"><i data-lucide="${x[0]}" class="h-4 w-4"></i>${x[1]}${x[1]=='Documents'?'<span class="ml-auto rounded-md bg-lime px-1.5 py-0.5 text-[10px] text-ink">12</span>':''}</button>`).join('');
const dashboard=`<div class="mx-auto max-w-7xl"><div class="mb-7 flex flex-wrap items-end justify-between gap-4"><div><div class="mb-2 inline-flex items-center gap-2 rounded-full bg-mint px-3 py-1 text-xs font-semibold text-emerald-700"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> All systems healthy</div><h2 class="text-3xl font-bold tracking-tight">Your financial pulse</h2><p class="mt-1 text-sm text-muted">Here’s what’s happening across your business.</p></div><button onclick="toast('Report exported as PDF')" class="flex items-center gap-2 rounded-xl border border-line bg-white px-4 py-2.5 text-sm font-semibold"><i data-lucide="download" class="h-4 w-4"></i> Export report</button></div>
<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4"><div class="rounded-2xl bg-ink p-5 text-white shadow-soft"><div class="flex justify-between text-sm text-white/60">Total balance <i data-lucide="wallet" class="h-4 w-4 text-lime"></i></div><div class="mt-6 text-3xl font-bold">$84,250.00</div><div class="mt-2 text-xs text-lime">↑ 12.8% <span class="text-white/50">vs last month</span></div></div><div class="rounded-2xl border border-line bg-white p-5"><div class="flex justify-between text-sm text-muted">Income <i data-lucide="trending-up" class="h-4 w-4 text-emerald-500"></i></div><div class="mt-6 text-3xl font-bold">$24,680.00</div><div class="mt-2 text-xs text-emerald-600">↑ 8.2% <span class="text-muted">vs last month</span></div></div><div class="rounded-2xl border border-line bg-white p-5"><div class="flex justify-between text-sm text-muted">Expenses <i data-lucide="trending-down" class="h-4 w-4 text-orange-400"></i></div><div class="mt-6 text-3xl font-bold">$8,432.00</div><div class="mt-2 text-xs text-orange-500">↓ 3.4% <span class="text-muted">vs last month</span></div></div><div class="rounded-2xl border border-line bg-white p-5"><div class="flex justify-between text-sm text-muted">Pending invoices <i data-lucide="clock-3" class="h-4 w-4 text-blue-400"></i></div><div class="mt-6 text-3xl font-bold">$6,890.00</div><div class="mt-2 text-xs text-muted">8 invoices awaiting payment</div></div></div>
<div class="mt-6 grid gap-6 xl:grid-cols-5"><div class="rounded-2xl border border-line bg-white p-5 xl:col-span-3"><div class="flex items-start justify-between"><div><h3 class="font-bold">Cash flow</h3><p class="mt-1 text-xs text-muted">Income and expenses · Last 6 months</p></div><button class="flex items-center gap-1 rounded-lg border border-line px-2.5 py-1.5 text-xs">Last 6 months <i data-lucide="chevron-down" class="h-3 w-3"></i></button></div><div class="chart-grid relative mt-6 h-56 overflow-hidden rounded-xl"><svg viewBox="0 0 700 220" preserveAspectRatio="none" class="absolute inset-0 h-full w-full"><path d="M0 170 C70 150 80 165 140 125 S220 155 280 105 S360 150 420 82 S520 112 580 62 S650 90 700 38" fill="none" stroke="#153b4a" stroke-width="4"/><path d="M0 188 C70 185 100 170 140 178 S220 160 280 180 S360 145 420 162 S520 150 580 143 S650 158 700 130" fill="none" stroke="#d7f36a" stroke-width="4"/></svg></div><div class="mt-4 flex gap-5 text-xs text-muted"><span><i class="mr-1 inline-block h-2 w-2 rounded-full bg-navy"></i>Income</span><span><i class="mr-1 inline-block h-2 w-2 rounded-full bg-lime"></i>Expenses</span></div></div><div class="rounded-2xl border border-line bg-white p-5 xl:col-span-2"><div class="flex items-start justify-between"><div><h3 class="font-bold">Document control</h3><p class="mt-1 text-xs text-muted">Keep your files moving forward</p></div><button onclick="navigate('Documents')" class="text-xs font-semibold text-navy">View all →</button></div><div class="mt-6 space-y-5"><div><div class="mb-2 flex justify-between text-sm"><span>Needs review</span><span class="font-semibold">12</span></div><div class="h-2 rounded-full bg-cream"><div class="h-2 w-2/5 rounded-full bg-orange-300"></div></div></div><div><div class="mb-2 flex justify-between text-sm"><span>Approved</span><span class="font-semibold">48</span></div><div class="h-2 rounded-full bg-cream"><div class="h-2 w-4/5 rounded-full bg-emerald-400"></div></div></div><div><div class="mb-2 flex justify-between text-sm"><span>Expiring soon</span><span class="font-semibold">05</span></div><div class="h-2 rounded-full bg-cream"><div class="h-2 w-1/4 rounded-full bg-red-300"></div></div></div></div><div class="mt-7 rounded-xl bg-cream p-3 text-xs text-muted"><i data-lucide="shield-check" class="mr-1 inline h-4 w-4 text-emerald-600"></i> Your documents are encrypted and secure</div></div></div>
<div class="mt-6 rounded-2xl border border-line bg-white p-5"><div class="mb-5 flex items-center justify-between"><div><h3 class="font-bold">Recent activity</h3><p class="mt-1 text-xs text-muted">Latest transactions and document updates</p></div><button class="text-xs font-semibold text-navy">See all activity →</button></div><div class="overflow-x-auto"><table class="w-full min-w-[620px] text-left text-sm"><thead class="border-b border-line text-xs text-muted"><tr><th class="pb-3 font-medium">Activity</th><th class="pb-3 font-medium">Category</th><th class="pb-3 font-medium">Date</th><th class="pb-3 text-right font-medium">Amount</th><th></th></tr></thead><tbody class="divide-y divide-line"><tr><td class="py-4"><div class="flex items-center gap-3"><div class="grid h-8 w-8 place-items-center rounded-lg bg-mint"><i data-lucide="arrow-down-left" class="h-4 w-4 text-emerald-600"></i></div><div><div class="font-medium">Payment from Acme Inc.</div><div class="text-xs text-muted">INV-2026-0042</div></div></div></td><td class="text-muted">Income</td><td class="text-muted">Sep 20, 2026</td><td class="text-right font-semibold text-emerald-600">+$4,250.00</td><td class="text-right"><i data-lucide="more-horizontal" class="ml-auto h-4 w-4 text-muted"></i></td></tr><tr><td class="py-4"><div class="flex items-center gap-3"><div class="grid h-8 w-8 place-items-center rounded-lg bg-orange-50"><i data-lucide="arrow-up-right" class="h-4 w-4 text-orange-500"></i></div><div><div class="font-medium">Figma subscription</div><div class="text-xs text-muted">Software & tools</div></div></div></td><td class="text-muted">Expense</td><td class="text-muted">Sep 19, 2026</td><td class="text-right font-semibold">-$78.00</td><td class="text-right"><i data-lucide="more-horizontal" class="ml-auto h-4 w-4 text-muted"></i></td></tr></tbody></table></div></div></div>`;
const pages={Transactions:'<h2 class="text-3xl font-bold">Transactions</h2><p class="mt-2 text-muted">Track every rupee coming in and going out.</p>',Documents:'<h2 class="text-3xl font-bold">Documents</h2><p class="mt-2 text-muted">One secure home for your business paperwork.</p>',Invoices:'<h2 class="text-3xl font-bold">Invoices</h2><p class="mt-2 text-muted">Create, send and track invoices in one place.</p>',Contacts:'<h2 class="text-3xl font-bold">Contacts</h2><p class="mt-2 text-muted">Your clients and vendors, organised.</p>',Settings:'<h2 class="text-3xl font-bold">Settings</h2><p class="mt-2 text-muted">Manage your workspace preferences.</p>'};
function render(){document.querySelector('#content').innerHTML=dashboard;lucide.createIcons()}function navigate(name){document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.innerText.trim().startsWith(name)));document.querySelector('#pageTitle').innerHTML=name==='Overview'?'Good morning, Sumit <span>👋</span>':name;document.querySelector('#content').innerHTML=name==='Overview'?dashboard:`<div class="mx-auto max-w-7xl fade"><div class="rounded-2xl border border-line bg-white p-8 md:p-12">${pages[name]}<div class="mt-10 rounded-2xl bg-cream p-8 text-center"><i data-lucide="construction" class="mx-auto h-8 w-8 text-muted"></i><h3 class="mt-4 font-bold">${name} workspace</h3><p class="mt-2 text-sm text-muted">This module is ready for your Supabase data.</p><button onclick="openModal()" class="mt-5 rounded-xl bg-ink px-4 py-2.5 text-sm font-semibold text-white">Add new</button></div></div></div>`;lucide.createIcons()}
function openModal(){document.querySelector('#modal').classList.replace('hidden','flex');lucide.createIcons()}function closeModal(){document.querySelector('#modal').classList.replace('flex','hidden')}function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.classList.remove('hidden');x.classList.add('toast');setTimeout(()=>x.classList.add('hidden'),3000)}render();
</script></body></html>
